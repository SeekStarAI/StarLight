[package]
name = "starlight-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Server runtime composition root for StarLight."
repository = "https://github.com/SeekStarAI/StarLight"
readme = "README.md"
publish = false

[dependencies]
sl-ir = "0.1.0"
sl-graph = "0.1.0"
sl-core = "0.1.0"
sl-device = "0.1.0"
starlight-backend-cpu = { path = "../../crates/backends/backend-cpu" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "starlight-runtime"
path = "src/main.rs"
